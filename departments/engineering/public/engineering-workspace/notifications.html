<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <title>Stock Notifications | Grand Horizon Hotel</title>
        <link href="styles.css" rel="stylesheet" />
    </head>
    <body data-page="Stock Notifications">
        <!-- Sidebar / Hotel Branding -->
        <aside class="sidebar">
            <div class="brand">
                <button
                    id="sidebarToggle"
                    class="sidebar-toggle"
                    type="button"
                    aria-label="Collapse sidebar"
                    aria-expanded="true"
                    title="Collapse sidebar"
                >
                    ❮
                </button>
                <img alt="Grand Horizon Hotel" src="assets/logo.png" />
            </div>
            <nav id="nav"></nav>
            <div class="account-container">
                <button
                    class="account-toggle"
                    id="accountToggle"
                    type="button"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    <span class="account-avatar" aria-hidden="true">👤</span>
                    <span id="accountName">Engineering Head</span>
                    <span aria-hidden="true">▾</span>
                </button>
                <div class="account-menu" id="accountMenu" hidden>
                    <button id="accountView" type="button">
                        👤 View Account
                    </button>
                    <button id="signOut" type="button">↪ Sign Out</button>
                </div>
            </div>
            <div
                id="sidebarResizeHandle"
                class="sidebar-resize-handle"
                role="separator"
                aria-label="Resize sidebar"
                aria-orientation="vertical"
                aria-valuemin="92"
                aria-valuemax="373"
                tabindex="0"
                title="Drag to resize sidebar"
            ></div>
        </aside>
        <div class="shell">
            <!-- Header / Search and Filters -->
            <header class="topbar">
                <h1 class="page-title">Stock Notifications</h1>
                <div class="top-actions">
                    <input
                        aria-label="Search records"
                        id="topSearch"
                        placeholder="&telrec; Search"
                        hidden
                    />
                    <button class="filter-button" id="filterToggle">
                        Filter &dtrif;
                    </button>
                    <div class="filter-panel hidden" id="filterPanel">
                        <label>
                            Category
                            <select id="categoryFilter">
                                <option>All</option>
                                <option>Requests</option>
                                <option>Work Orders</option>
                                <option>Repair</option>
                            </select>
                        </label>
                        <label>
                            Priority
                            <select id="priorityFilter">
                                <option value="All">All priorities</option>
                                <option>Low</option>
                                <option>Medium</option>
                                <option>High</option>
                                <option>Urgent</option>
                            </select>
                        </label>
                        <label>
                            Status
                            <select id="statusFilter">
                                <option value="All">All statuses</option>
                                <option>Pending</option>
                                <option>In Review</option>
                                <option>Assigned</option>
                                <option>Reassigned</option>
                                <option>In Repair</option>
                                <option>Verifying</option>
                                <option>Completed</option>
                                <option>Closed</option>
                            </select>
                        </label>
                        <button class="secondary" id="clearFilters">
                            Clear filters
                        </button>
                    </div>
                </div>
            </header>
            <!-- Page Content - rendered by app.js -->
            <main id="app"></main>
        </div>
        <div id="toast" role="status"></div>
        <script src="app.js"></script>
        <!-- Record Details Modal -->
        <div class="detail-modal" hidden="" id="detailModal"></div>
        <dialog id="accountDialog" class="account-dialog">
            <h2>My Account</h2>
            <div class="account-large-avatar" id="accountAvatar">E</div>
            <p><strong>Name:</strong> <span id="accountFullName"></span></p>
            <p>
                <strong>Email / Username:</strong>
                <span id="accountEmail"></span>
            </p>
            <p><strong>Role:</strong> <span id="accountRole"></span></p>
            <button
                class="secondary"
                type="button"
                data-action="change-password"
            >
                Change Password
            </button>
            <form method="dialog">
                <button class="secondary">Close</button>
            </form>
        </dialog>
    </body>
</html>
